version: "2"
sql:
  - engine: postgresql
    schema: internal/migrations/files
    queries: sql/queries
    gen:
      go:
        package: auditdb
        out: internal/audit/postgresql
        sql_package: pgx/v5
        emit_db_tags: true
        emit_empty_slices: true
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: true
        emit_result_struct_pointers: true
